<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>演示包 · 我真的没病</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 40px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #0b0d14; color: #f2f4f8; line-height: 1.65; font-size: 15px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .meta { color: #9aa3b8; font-size: 13px; margin-bottom: 18px; }
  .box {
    padding: 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.09); margin-bottom: 14px;
  }
  .row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; }
  .row span:first-child { color: #9aa3b8; }
  ul { padding-left: 20px; margin: 8px 0 0; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 12px; background: rgba(75, 107, 255, 0.22); color: #a9b8ff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>演示包</h1>
  <p class="meta">com.pbwk9999.demo · 来自「我真的没病」源</p>
  <div class="box">
    <p style="margin:0">这是用来测试源的演示包，装完不会改变系统任何行为。</p>
  </div>
  <div class="box">
    <div class="row"><span>版本</span><span>1.0.0</span></div>
    <div class="row"><span>作者</span><span>pbwk9999</span></div>
    <div class="row"><span>兼容</span><span>rootless / roothide</span></div>
  </div>
  <div class="box">
    <strong>更新日志</strong>
    <ul>
      <li>1.0.0 · 第一个版本</li>
    </ul>
  </div>
  <p class="meta"><span class="tag">装完可以删</span></p>
</div>
</body>
</html>
